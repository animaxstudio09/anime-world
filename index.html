<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMAX AI ASSISTANT</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #00f3ff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .ai-container {
            text-align: center;
            background: #141414;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            width: 90%;
            max-width: 400px;
        }
        .mic-btn {
            background: linear-gradient(45deg, #00f3ff, #008b99);
            color: #000;
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
            box-shadow: 0 0 15px #00f3ff;
        }
        .mic-btn:active { transform: scale(0.9); }
        .mic-btn.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(45deg, #ff3b3b, #cc0000);
            box-shadow: 0 0 20px #ff3b3b;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255,59,59,0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,59,59,1); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255,59,59,0.7); }
        }
        .status-text { font-size: 16px; color: #aaa; margin-bottom: 10px; }
        .command-text { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 20px; min-height: 30px; }
        .reply-text { font-size: 18px; color: #D4AF37; font-weight: bold; }
    </style>
</head>
<body>

    <div class="ai-container">
        <h2 style="margin-bottom: 30px;">JARVIS <span style="color:#D4AF37">AI</span></h2>
        
        <button id="mic-btn" class="mic-btn" onclick="startListening()">
            <i class="fas fa-microphone"></i>
        </button>
        
        <div class="status-text" id="status">একাধিক কাজের জন্য মাইক বাটনে ক্লিক করুন...</div>
        <div class="command-text" id="user-command"></div>
        <div class="reply-text" id="ai-reply"></div>
    </div>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status');
        const commandText = document.getElementById('user-command');
        const aiReply = document.getElementById('ai-reply');

        // Web Speech API Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজার ভয়েস রিকগনিশন সাপোর্ট করে না। দয়া করে Google Chrome ব্যবহার করুন।");
        }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'bn-BD'; // বাংলা ভাষা সেট করা হলো
        recognition.continuous = false;

        // কথা বলা শুরু করলে
        recognition.onstart = function() {
            micBtn.classList.add('listening');
            statusText.innerText = "আমি শুনছি, বলুন বস...";
            commandText.innerText = "";
            aiReply.innerText = "";
        };

        // কথা বলা শেষ হলে রেজাল্ট রিসিভ করা
        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            commandText.innerText = `আপনি বলেছেন: "${transcript}"`;
            processCommand(transcript.toLowerCase());
        };

        // কোনো এরর হলে
        recognition.onerror = function(event) {
            statusText.innerText = "কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।";
            micBtn.classList.remove('listening');
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
            statusText.innerText = "মাইক বাটনে ক্লিক করুন...";
        };

        function startListening() {
            recognition.start();
        }

        // এআই কে বাংলায় কথা বলানোর ফাংশন
        function speakBangla(text) {
            aiReply.innerText = text;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD'; // বাংলায় কথা বলবে
            utterance.rate = 1; // কথা বলার স্পিড
            utterance.pitch = 1; // গলার স্বর
            window.speechSynthesis.speak(utterance);
        }

        // আপনার কমান্ড প্রসেস করা (এখানে আপনার ইচ্ছা মতো কমান্ড যুক্ত করতে পারবেন)
        function processCommand(command) {
            
            if (command.includes("গিটহাব") || command.includes("github")) {
                speakBangla("গিটহাব ওপেন করছি বস। একটু অপেক্ষা করুন।");
                setTimeout(() => { window.open("https://github.com", "_blank"); }, 2000);
            } 
            
            else if (command.includes("অ্যানিম্যাক্স") || command.includes("animax")) {
                speakBangla("অ্যানিম্যাক্স অ্যাপ ওপেন করছি।");
                // এখানে আপনার অ্যানিম্যাক্স সাইটের লিংক দিন
                setTimeout(() => { window.open("https://rockyhack09.github.io/animax-x/", "_blank"); }, 2000);
            } 
            
            else if (command.includes("তোমার নাম কি") || command.includes("নাম কি")) {
                speakBangla("আমার নাম অ্যানিম্যাক্স এ আই অ্যাসিস্ট্যান্ট। আমাকে রকি বস তৈরি করেছেন।");
            } 
            
            else if (command.includes("কেমন আছো")) {
                speakBangla("আমি খুব ভালো আছি বস! আজ আমি আপনাকে কীভাবে সাহায্য করতে পারি?");
            } 
            
            else if (command.includes("ইউটিউব") || command.includes("youtube")) {
                speakBangla("ইউটিউব চালু করছি।");
                setTimeout(() => { window.open("https://youtube.com", "_blank"); }, 2000);
            }
            
            else if (command.includes("সময় কত") || command.includes("কয়টা বাজে")) {
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                let ampm = hours >= 12 ? 'পিএম' : 'এএম';
                hours = hours % 12;
                hours = hours ? hours : 12; 
                speakBangla(`এখন সময় ${hours} টা বেজে ${minutes} মিনিট ${ampm}।`);
            }
            
            else {
                speakBangla("দুঃখিত বস, আমি আপনার কথা বুঝতে পারিনি। দয়া করে আবার বলুন।");
            }
        }
    </script>
</body>
</html>
